project_id = "trade-journal"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/login", "http://localhost:5173/reset-password", "http://127.0.0.1:5173/login", "http://127.0.0.1:5173/reset-password"]

[auth.email]
# Local Supabase: create a session immediately after email/password signup.
# Hosted projects require the matching dashboard change; see docs/google-sign-in.md.
enable_confirmations = false

[functions.zerodha]
# The handler verifies the user's bearer token with Supabase Auth on EVERY request.
# This accommodates projects using the new publishable keys/JWT signing keys.
verify_jwt = false
